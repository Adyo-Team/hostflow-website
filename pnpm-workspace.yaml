# Keep the existing dependency review and install-script policy.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
enableGlobalVirtualStore: false
# Avoid linking mutable package files back into the package store.
packageImportMethod: clone-or-copy
# Dependency installation is explicit in local development and CI.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
